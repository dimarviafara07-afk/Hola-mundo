<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuerteFácil P2P</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .app-container { width: 100%; max-width: 400px; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; cursor: pointer; background: #22c55e; border: none; color: white; font-weight: bold; border-radius: 6px; margin-top: 10px; }
        .btn-danger { background: #ef4444; }
        .status-text { font-size: 0.9rem; color: #94a3b8; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="authView" class="card">
        <h2 style="text-align: center;">Acceso SuerteFácil</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="pass" placeholder="Contraseña">
        <button id="btnAuth">INGRESAR</button>
    </div>

    <div id="gameView" class="card hidden">
        <h2 style="text-align: center;">Sala P2P</h2>
        <p id="userEmail" class="status-text"></p>
        <div style="font-size: 1.5rem; text-align: center; color: #22c55e; margin: 15px 0;" id="saldoDisplay">Saldo: $0</div>
        
        <button id="btnPlay">BUSCAR PARTIDA ($2K)</button>
        <button id="btnOut" class="btn-danger">CERRAR SESIÓN</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // CONFIGURACIÓN (Tus datos)
    const firebaseConfig = {
        apiKey: "AIzaSyDh8g0vyKbRfPPOZ1C0M0guBr0EJ77AyF8",
        authDomain: "carta-facil-a4e22.firebaseapp.com",
        databaseURL: "https://carta-facil-a4e22-default-rtdb.firebaseio.com",
        projectId: "carta-facil-a4e22",
        storageBucket: "carta-facil-a4e22.appspot.com",
        messagingSenderId: "530927580102",
        appId: "1:530927580102:web:865211e2b16e84869038c7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // CONTROLADORES DE VISTA
    const views = {
        auth: document.getElementById('authView'),
        game: document.getElementById('gameView')
    };

    // LÓGICA DE SESIÓN
    onAuthStateChanged(auth, (user) => {
        if (user) {
            views.auth.classList.add('hidden');
            views.game.classList.remove('hidden');
            document.getElementById('userEmail').innerText = user.email;
            
            // Escuchar saldo en tiempo real
            onValue(ref(db, `usuarios/${user.uid}/saldo`), (snap) => {
                const saldo = snap.val() || 0;
                document.getElementById('saldoDisplay').innerText = `Saldo: $${saldo.toLocaleString()}`;
            });
        } else {
            views.auth.classList.remove('hidden');
            views.game.classList.add('hidden');
        }
    });

    // BOTONES
    document.getElementById('btnAuth').addEventListener('click', () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, e, p).catch(err => alert("Error: " + err.message));
    });

    document.getElementById('btnOut').addEventListener('click', () => signOut(auth));

    document.getElementById('btnPlay').addEventListener('click', () => {
        alert("Buscando partida en el servidor...");
        // Aquí puedes agregar la lógica de búsqueda que teníamos
    });
</script>

</body>
</html>
