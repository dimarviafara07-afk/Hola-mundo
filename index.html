<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Mayor P2P</title>
  <style>
    /* Estilos generales oscuros tipo casino */
    body {
      margin: 0;
      padding: 0;
      background-color: #121620;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Encabezado con el Saldo */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #1e2433, #151a26);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .saldo-box {
      text-align: right;
    }

    .saldo-monto {
      font-size: 1.2rem;
      font-weight: bold;
      color: #00ff88;
    }

    /* Selector de Progresión (Mesas del juego) */
    .progression-container {
      background: #1c2237;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }

    .mesas-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .mesa-btn {
      background: #252e4d;
      border: 2px solid #3b4875;
      color: white;
      padding: 10px 5px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      font-size: 0.85rem;
    }

    .mesa-btn.active {
      background: #00ff88;
      color: #121620;
      border-color: #00ff88;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    /* El Tapete de Juego (Las 3 cartas) */
    .game-mat {
      background: radial-gradient(circle, #1a2f24, #0f1c15);
      border: 3px solid #1f5c3d;
      border-radius: 16px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      min-height: 180px;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
    }

    .slot-jugador {
      text-align: center;
    }

    .carta {
      width: 100%;
      aspect-ratio: 2/3;
      background: #252e4d;
      border: 2px dashed #48588f;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .carta.ready {
      background: #ffffff;
      color: #000000;
      border: 2px solid #ffffff;
    }

    .carta.waiting {
      animation: pulse 1.5s infinite;
      color: #48588f;
      font-size: 1rem;
    }

    .nombre-jugador {
      font-size: 0.8rem;
      color: #a0aec0;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    /* Botón de Acción Principal */
    .btn-play {
      background: linear-gradient(135deg, #00ff88, #00b35f);
      border: none;
      color: #121620;
      padding: 18px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
      transition: 0.1s;
    }

    .btn-play:active {
      transform: scale(0.98);
      box-shadow: 0 2px 5px rgba(0, 255, 136, 0.2);
    }

    /* Historial de partidas */
    .history {
      background: #1c2237;
      padding: 15px;
      border-radius: 12px;
    }

    .history h3 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      color: #a0aec0;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 5px 0;
      border-bottom: 1px solid #252e4d;
    }

    .history-item:last-child {
      border: none;
    }

    .win { color: #00ff88; }
    .lose { color: #ff3366; }

    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="header">
      <div><strong>SuerteFácil P2P</strong></div>
      <div class="saldo-box">
        <div style="font-size: 0.75rem; color: #a0aec0;">Tu Saldo</div>
        <div class="saldo-monto">$50.000</div>
      </div>
    </div>

    <div class="progression-container">
      <span style="font-size: 0.85rem; color: #a0aec0;">Selecciona tu Mesa (Progresión)</span>
      <div class="mesas-grid">
        <button class="mesa-btn active">N1 ($2k)</button>
        <button class="mesa-btn">N2 ($4k)</button>
        <button class="mesa-btn">N3 ($8k)</button>
        <button class="mesa-btn">N4 ($16k)</button>
        <button class="mesa-btn">N5 ($32k)</button>
      </div>
    </div>

    <div class="game-mat">
      <div class="slot-jugador">
        <div class="carta ready">?</div>
        <div class="nombre-jugador">Tú</div>
      </div>
      <div class="slot-jugador">
        <div class="carta waiting">...</div>
        <div class="nombre-jugador">Esperando...</div>
      </div>
      <div class="slot-jugador">
        <div class="carta waiting">...</div>
        <div class="nombre-jugador">Esperando...</div>
      </div>
    </div>

    <button id="botonJugar" class="btn-play">BUSCAR PARTIDA</button>

    <div class="history">
      <h3>ÚLTIMAS PARTIDAS</h3>
      <div class="history-item">
        <span>Mesa N1 ($2k) - Ganaste</span>
        <span class="win">+$5.400</span>
      </div>
      <div class="history-item">
        <span>Mesa N1 ($2k) - Perdiste</span>
        <span class="lose">-$2.000</span>
      </div>
    </div>

  </div>

  <script>
    const botonesMesa = document.querySelectorAll('.mesa-btn');
    const botonJugar = document.getElementById('botonJugar');

    botonesMesa.forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.mesa-btn.active').classList.remove('active');
        btn.classList.add('active');
        const valor = btn.innerText.split(' ')[1];
        botonJugar.innerText = `BUSCAR PARTIDA (${valor})`;
      });
    });
  </script>

</body>
