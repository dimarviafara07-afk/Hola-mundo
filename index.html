<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, runTransaction, off } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDh8g0vyKbRfPPOZ1C0M0guBr0EJ77AyF8",
        authDomain: "carta-facil-a4e22.firebaseapp.com",
        databaseURL: "https://carta-facil-a4e22-default-rtdb.firebaseio.com",
        projectId: "carta-facil-a4e22",
        storageBucket: "carta-facil-a4e22.appspot.com",
        messagingSenderId: "530927580102",
        appId: "1:530927580102:web:865211e2b16e84869038c7"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // Variables de Estado
    let usuarioActualEmail = "", usuarioActualUID = "", saldoActualNumerico = 0, mesaSeleccionadaValor = 2000, partidaEscuchadorRef = null;

    // Elementos DOM
    const authContainer = document.getElementById('authContainer'), gameInterface = document.getElementById('gameInterface');
    const emailInput = document.getElementById('emailInput'), passwordInput = document.getElementById('passwordInput');
    const btnLogin = document.getElementById('btnLogin'), btnRegister = document.getElementById('btnRegister');
    const saldoDisplay = document.getElementById('saldoDisplay'), botonJugar = document.getElementById('botonJugar');

    // Lógica Auth
    onAuthStateChanged(auth, (user) => {
        if (user) {
            authContainer.style.display = 'none'; gameInterface.style.display = 'flex';
            usuarioActualEmail = user.email; usuarioActualUID = user.uid;
            onValue(ref(database, 'usuarios/' + user.uid + '/saldo'), (s) => {
                saldoActualNumerico = Number(s.val() || 0);
                saldoDisplay.innerText = `$${saldoActualNumerico.toLocaleString('es-CO')}`;
            });
        } else {
            authContainer.style.display = 'flex'; gameInterface.style.display = 'none';
        }
    });

    btnLogin.addEventListener('click', () => signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value).catch(e => alert(e.message)));
    btnRegister.addEventListener('click', () => {
        createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(cred => set(ref(database, 'usuarios/' + cred.user.uid), { email: cred.user.email, saldo: 0 }))
        .catch(e => alert(e.message));
    });

    // Lógica del Juego (Emparejamiento)
    botonJugar.addEventListener('click', () => {
        if (saldoActualNumerico < mesaSeleccionadaValor) return alert("Saldo insuficiente");
        botonJugar.disabled = true;
        botonJugar.innerText = "BUSCANDO RIVALES...";
        
        const salasRef = ref(database, `salas_espera/${mesaSeleccionadaValor}`);
        runTransaction(salasRef, (sala) => {
            if (!sala) return { j1_uid: usuarioActualUID, j1_name: usuarioActualEmail.split('@')[0], status: "esperando" };
            if (sala.status === "esperando") { sala.j2_uid = usuarioActualUID; sala.j2_name = usuarioActualEmail.split('@')[0]; sala.status = "llena"; return sala; }
            return;
        }).then(result => {
            if (!result.committed) return alert("Intenta de nuevo");
            if (result.snapshot.val().status === "llena") ejecutarPartida(result.snapshot.val());
        });
    });

    function ejecutarPartida(sala) {
        // Lógica de sorteo de cartas
        const c1 = Math.floor(Math.random() * 13) + 2;
        const c2 = Math.floor(Math.random() * 13) + 2;
        const ganador = (c1 > c2) ? sala.j1_uid : sala.j2_uid;
        
        // Actualización de saldos
        runTransaction(ref(database, `usuarios/${ganador}/saldo`), (s) => (s || 0) + mesaSeleccionadaValor);
        const perdedor = (ganador === sala.j1_uid) ? sala.j2_uid : sala.j1_uid;
        runTransaction(ref(database, `usuarios/${perdedor}/saldo`), (s) => (s || 0) - mesaSeleccionadaValor);
        
        alert(`Partida finalizada. Ganador: ${c1 > c2 ? sala.j1_name : sala.j2_name}`);
        set(ref(database, `salas_espera/${mesaSeleccionadaValor}`), null);
        botonJugar.disabled = false;
        botonJugar.innerText = `BUSCAR PARTIDA ($${(mesaSeleccionadaValor/1000)}k)`;
    }

    document.getElementById('btnSignOut').addEventListener('click', () => signOut(auth));
</script>
