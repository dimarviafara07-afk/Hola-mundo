<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuerteFácil P2P</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #22c55e;
            --secondary: #3b82f6;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --border-color: #334155;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 20px; 
            margin: 0; 
            box-sizing: border-box;
        }

        .app-container { width: 100%; max-width: 430px; }
        
        .card { 
            background: var(--bg-card); 
            padding: 2rem 1.5rem; 
            border-radius: 1rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
        }

        .hidden { display: none !important; }
        .form-group { margin-bottom: 15px; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid var(--border-color); 
            background: var(--bg-dark); 
            color: var(--text-main); 
            box-sizing: border-box; 
        }
        input:focus { outline: none; border-color: var(--primary); }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid var(--danger);
        }

        button { 
            width: 100%; 
            padding: 12px; 
            cursor: pointer; 
            border: none; 
            color: white; 
            font-weight: bold; 
            border-radius: 6px; 
            margin-top: 10px; 
            transition: all 0.2s; 
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-primary { background: var(--primary); }
        .btn-secondary { background: var(--secondary); margin-top: 15px; }
        .btn-danger { background: var(--danger); }
        
        .saldo-display {
            font-size: 1.6rem; 
            text-align: center; 
            color: var(--primary); 
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Tablero de Juego */
        .game-mat { display: flex; justify-content: space-between; margin: 25px 0; }
        
        .carta-box { text-align: center; width: 30%; }
        .carta-label { font-size: 0.75rem; margin-bottom: 6px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .carta { 
            height: 95px; 
            background: #252e4d; 
            border: 2px dashed #48588f; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.6rem; 
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .carta.revelada {
            background: #ffffff;
            color: #0f172a;
            border: 2px solid #3b82f6;
        }

        /* Historial de Jugadas */
        .historial-container {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .historial-title { font-size: 0.9rem; color: #94a3b8; font-weight: bold; margin-bottom: 10px; }
        .historial-lista { max-height: 120px; overflow-y: auto; font-size: 0.8rem; }
        .jugada-item { 
            padding: 6px 8px; 
            margin-bottom: 5px; 
            border-radius: 4px; 
            background: rgba(255,255,255,0.03); 
            display: flex; 
            justify-content: space-between;
        }
        .jugada-ganó { border-left: 3px solid var(--primary); }
        .jugada-perdió { border-left: 3px solid var(--danger); }
        
        .divider { text-align: center; margin: 15px 0 5px 0; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="authView" class="card">
        <h2 style="text-align: center; margin-top: 0;">Acceso SuerteFácil</h2>
        <div id="errorBox" class="error-message hidden"></div>
        <form id="loginForm">
            <div class="form-group"><input type="email" id="email" placeholder="Correo electrónico" required autocomplete="email"></div>
            <div class="form-group"><input type="password" id="pass" placeholder="Contraseña" required autocomplete="current-password"></div>
            <button type="submit" id="btnAuth" class="btn-primary">INGRESAR</button>
            <div class="divider">o si eres nuevo</div>
            <button type="button" id="btnRegister" class="btn-secondary">REGISTRARSE</button>
        </form>
    </div>

    <div id="gameView" class="card hidden">
        <h2 style="text-align: center; margin-top: 0; font-size: 1.5rem;">SuerteFácil P2P</h2>
        <div id="saldoDisplay" class="saldo-display">Saldo: $0</div>
        
        <div class="game-mat">
            <div class="carta-box">
                <div class="carta-label">Tú</div>
                <div class="carta" id="cartaLocal">?</div>
            </div>
            <div class="carta-box">
                <div class="carta-label" id="lblRival1">Rival 1</div>
                <div class="carta" id="cartaRival1">?</div>
            </div>
            <div class="carta-box">
                <div class="carta-label" id="lblRival2">Rival 2</div>
                <div class="carta" id="cartaRival2">?</div>
            </div>
        </div>

        <button id="btnPlay" class="btn-primary">BUSCAR PARTIDA ($2K)</button>
        <button id="btnOut" class="btn-danger">CERRAR SESIÓN</button>

        <div class="historial-container">
            <div class="historial-title">Historial de Jugadas</div>
            <div id="historialLista" class="historial-lista">
                </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, off, set, get, push, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDh8g0vyKbRfPPOZ1C0M0guBr0EJ77AyF8",
        authDomain: "carta-facil-a4e22.firebaseapp.com",
        databaseURL: "https://carta-facil-a4e22-default-rtdb.firebaseio.com",
        projectId: "carta-facil-a4e22",
        storageBucket: "carta-facil-a4e22.appspot.com",
        messagingSenderId: "530927580102",
        appId: "1:530927580102:web:865211e2b16e84869038c7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // DOM
    const authView = document.getElementById('authView'), gameView = document.getElementById('gameView');
    const loginForm = document.getElementById('loginForm'), emailInput = document.getElementById('email'), passInput = document.getElementById('pass');
    const btnAuth = document.getElementById('btnAuth'), btnRegister = document.getElementById('btnRegister'), errorBox = document.getElementById('errorBox');
    const saldoDisplay = document.getElementById('saldoDisplay'), btnOut = document.getElementById('btnOut'), btnPlay = document.getElementById('btnPlay');
    const cartaLocal = document.getElementById('cartaLocal'), cartaRival1 = document.getElementById('cartaRival1'), cartaRival2 = document.getElementById('cartaRival2');
    const lblRival1 = document.getElementById('lblRival1'), lblRival2 = document.getElementById('lblRival2'), historialLista = document.getElementById('historialLista');

    let saldoRef = null, historialRef = null;
    let saldoActual = 0;

    const getFirebaseErrorMsg = (code) => {
        switch (code) {
            case 'auth/invalid-credential': return 'Datos incorrectos.';
            case 'auth/email-already-in-use': return 'Este correo ya existe.';
            case 'auth/weak-password': return 'Contraseña muy corta (mínimo 6 caracteres).';
            default: return 'Error en el proceso.';
        }
    };

    // Control de Sesión
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            authView.classList.add('hidden'); gameView.classList.remove('hidden'); errorBox.classList.add('hidden');
            
            // Asignación de saldo inicial si es nuevo
            saldoRef = ref(db, `usuarios/${user.uid}/saldo`);
            const snap = await get(saldoRef);
            if (!snap.exists()) await set(saldoRef, 10000);

            // Escucha de saldo activa
            onValue(saldoRef, (s) => {
                saldoActual = s.val() || 0;
                saldoDisplay.innerText = `Saldo: $${saldoActual.toLocaleString('es-CO')}`;
            });

            // Conectar e imprimir Registro de Jugadas
            historialRef = ref(db, `usuarios/${user.uid}/historial`);
            onValue(historialRef, (s) => {
                historialLista.innerHTML = "";
                const data = s.val();
                if (data) {
                    Object.values(data).reverse().forEach(j => {
                        const item = document.createElement('div');
                        item.className = `jugada-item ${j.resultado === 'GANASTE' ? 'jugada-ganó' : 'jugada-perdió'}`;
                        item.innerHTML = `<span>${j.resultado} (Tú: ${j.tuCarta} vs R: ${j.rivalMax})</span> <strong>${j.resultado === 'GANASTE' ? '+' : '-'}$2,000</strong>`;
                        historialLista.appendChild(item);
                    });
                } else {
                    historialLista.innerHTML = "<div style='color:#64748b; text-align:center;'>No hay jugadas recientes</div>";
                }
            });

        } else {
            authView.classList.remove('hidden'); gameView.classList.add('hidden');
            if (saldoRef) off(saldoRef);
            if (historialRef) off(historialRef);
            resetMesa();
        }
    });

    // Login y Registro
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        btnAuth.disabled = true; btnAuth.innerText = "VERIFICANDO..."; errorBox.classList.add('hidden');
        try { await signInWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value); loginForm.reset(); } 
        catch (err) { errorBox.innerText = getFirebaseErrorMsg(err.code); errorBox.classList.remove('hidden'); }
        finally { btnAuth.disabled = false; btnAuth.innerText = "INGRESAR"; }
    });

    btnRegister.addEventListener('click', async () => {
        if (!emailInput.value || !passInput.value) { alert("Completa los campos."); return; }
        btnRegister.disabled = true; btnRegister.innerText = "CREANDO..."; errorBox.classList.add('hidden');
        try {
            const res = await createUserWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value);
            await set(ref(db, `usuarios/${res.user.uid}/saldo`), 10000);
            loginForm.reset();
        } catch (err) { errorBox.innerText = getFirebaseErrorMsg(err.code); errorBox.classList.remove('hidden'); }
        finally { btnRegister.disabled = false; btnRegister.innerText = "REGISTRARSE"; }
    });

    btnOut.addEventListener('click', () => signOut(auth));

    // LÓGICA DE PARTIDA REAL CONECTADA A LA BASE DE DATOS (P2P)
    btnPlay.addEventListener('click', async () => {
        if (saldoActual < 2000) { alert("Saldo insuficiente ($2,000 necesarios)"); return; }
        
        btnPlay.disabled = true;
        btnPlay.innerText = "BUSCANDO PARTIDA EN BD...";
        resetMesa();

        const user = auth.currentUser;
        const lobbyRef = ref(db, 'sala_espera');

        // Transacción segura en Firebase para unirse a una sala común
        try {
            const pushSala = push(lobbyRef);
            const miCupoRef = ref(db, `sala_espera/${pushSala.key}`);
            
            // Registramos nuestra intención de jugar en la base de datos externa
            await set(miCupoRef, { uid: user.uid, email: user.email.split('@')[0] });

            // Monitorear la sala de espera hasta que entren 3 jugadores
            onValue(lobbyRef, async (snapshot) => {
                const jugadores = snapshot.val();
                if (jugadores && Object.keys(jugadores).length >= 3) {
                    off(lobbyRef); // Apagar listener de la sala

                    // Tomamos los 3 primeros de la fila
                    const claves = Object.keys(jugadores).slice(0, 3);
                    const listaP2P = claves.map(k => jugadores[k]);

                    // Si somos parte de los 3 elegidos, jugamos la ronda unificada
                    const yoEnPartida = listaP2P.find(p => p.uid === user.uid);
                    if (yoEnPartida) {
                        // Limpiar los 3 cupos usados de la sala común para no duplicar
                        claves.forEach(async (k) => await set(ref(db, `sala_espera/${k}`), null));
                        ejecutarRondaP2P(listaP2P, user);
                    }
                }
            });
        } catch (e) {
            btnPlay.disabled = false;
            btnPlay.innerText = "BUSCAR PARTIDA ($2K)";
        }
    });

    // PROCESAMIENTO MATEMÁTICO Y DESCUENTO DE SALDO EN BD
    async function ejecutarRondaP2P(jugadores, user) {
        btnPlay.innerText = "SALA LLENA! JUGANDO...";

        // Identificar quiénes son mis rivales asignados en la BD
        const misRivales = jugadores.filter(p => p.uid !== user.uid);
        lblRival1.innerText = misRivales[0].email;
        lblRival2.innerText = misRivales[1].email;

        // Descontar la apuesta de la Base de Datos
        const nuevoSaldoPostApuesta = saldoActual - 2000;
        await set(ref(db, `usuarios/${user.uid}/saldo`), nuevoSaldoPostApuesta);

        // Generar números sincronizados simulando la entrega de cartas
        const miCarta = Math.floor(Math.random() * 10) + 1;
        const cRival1 = Math.floor(Math.random() * 10) + 1;
        const cRival2 = Math.floor(Math.random() * 10) + 1;

        // Revelar visualmente las cartas en la pantalla
        setTimeout(async () => {
            cartaLocal.innerText = miCarta; cartaLocal.classList.add('revelada');
            cartaRival1.innerText = cRival1; cartaRival1.classList.add('revelada');
            cartaRival2.innerText = cRival2; cartaRival2.classList.add('revelada');

            const rivalMaximo = Math.max(cRival1, cRival2);
            let resultadoFinal = "PERDISTE";

            if (miCarta > rivalMaximo) {
                resultadoFinal = "GANASTE";
                // Sumar pozo completo acumulado de la mesa ($6,000)
                await set(ref(db, `usuarios/${user.uid}/saldo`), nuevoSaldoPostApuesta + 6000);
            }

            // AÑADIR REGISTRO DE JUGADA A FIREBASE
            const nuevoHistorialRef = push(ref(db, `usuarios/${user.uid}/historial`));
            await set(nuevoHistorialRef, {
                resultado: resultadoFinal,
                tuCarta: miCarta,
                rivalMax: rivalMaximo,
                fecha: new Date().toISOString()
            });

            alert(resultadoFinal === "GANASTE" ? `¡Felicidades! Ganaste $6,000 con tu ${miCarta}` : `Perdiste contra un ${rivalMaximo}`);
            
            btnPlay.disabled = false;
            btnPlay.innerText = "BUSCAR PARTIDA ($2K)";
        }, 1500);
    }

    function resetMesa() {
        [cartaLocal, cartaRival1, cartaRival2].forEach(c => { c.innerText = "?"; c.classList.remove('revelada'); });
        lblRival1.innerText = "Rival 1"; lblRival2.innerText = "Rival 2";
    }
</script>

</body>
</html>
