<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Mayor P2P</title>
<style>
/* Estilos generales oscuros tipo casino - AZUL MEDIANOCHE Y DORADO ORO */
body {
margin: 0;
padding: 0;
background-color: #060a1f; /* Fondo nocturno profundo */
color: #ffffff;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
}

.app-container {
width: 100%;
max-width: 450px;
padding: 20px;
box-sizing: border-box;
display: flex;
flex-direction: column;
gap: 20px;
}

/* SECCIÓN DE AUTENTICACIÓN */
.auth-container {
background: linear-gradient(135deg, #0a0f24, #121a36);
padding: 25px;
border-radius: 16px;
box-shadow: 0 8px 25px rgba(0,0,0,0.6);
display: flex;
flex-direction: column;
gap: 15px;
border: 1px solid #d4af37; /* Borde dorado de bienvenida */
}

.auth-container h2 {
margin: 0;
font-size: 1.4rem;
text-align: center;
color: #d4af37; /* Texto Dorado */
text-transform: uppercase;
letter-spacing: 1px;
}

.auth-input {
width: 100%;
padding: 12px;
box-sizing: border-box;
background-color: #050814;
border: 1px solid #232e52;
border-radius: 8px;
color: white;
font-size: 1rem;
outline: none;
transition: 0.2s;
}

.auth-input:focus {
border-color: #d4af37;
box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
}

/* Contenedor especial para la contraseña y el ojito */
.password-wrapper {
position: relative;
width: 100%;
}

.password-wrapper .auth-input {
padding-right: 45px;
}

.btn-toggle-password {
position: absolute;
right: 12px;
top: 50%;
transform: translateY(-50%);
background: transparent;
border: none;
color: #a0aec0;
cursor: pointer;
font-size: 1.2rem;
padding: 0;
line-height: 1;
}

.btn-toggle-password:hover {
color: #d4af37;
}

.auth-buttons {
display: flex;
gap: 10px;
margin-top: 5px;
}

.btn-auth {
flex: 1;
padding: 12px;
font-size: 0.95rem;
font-weight: bold;
border-radius: 8px;
cursor: pointer;
border: none;
transition: 0.2s;
}

.btn-login { background: #d4af37; color: #060a1f; }
.btn-register { background: transparent; color: #d4af37; border: 2px solid #d4af37; }

/* INTERFAZ DE JUEGO */
.game-interface {
display: none;
flex-direction: column;
gap: 20px;
}

.header {
display: flex;
justify-content: space-between;
align-items: center;
background: linear-gradient(135deg, #0a0f24, #121a36);
padding: 15px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.4);
border: 1px solid #232e52;
}

.user-info-box {
display: flex;
flex-direction: column;
gap: 5px;
}

.btn-logout {
background: transparent;
color: #ff3366;
border: 1px solid #ff3366;
padding: 3px 6px;
font-size: 0.7rem;
border-radius: 4px;
cursor: pointer;
font-weight: bold;
width: fit-content;
}

.saldo-box {
text-align: right;
display: flex;
flex-direction: column;
align-items: flex-end;
gap: 5px;
}

.saldo-monto {
font-size: 1.2rem;
font-weight: bold;
color: #d4af37; /* Saldo en Oro */
}

.caja-botones-transaccion { display: flex; gap: 5px; }

.btn-transaccion {
color: white;
border: none;
padding: 5px 8px;
font-size: 0.7rem;
font-weight: bold;
border-radius: 4px;
cursor: pointer;
}

.btn-recargar-estilo { background: #28a745; }
.btn-retirar-estilo { background: #dc3545; }

/* Selector de Progresión */
.progression-container {
background: #0a0f24;
padding: 15px;
border-radius: 12px;
text-align: center;
border: 1px solid #232e52;
}

.mesas-grid {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 8px;
margin-top: 10px;
}

/* Ajuste móvil súper compacto para las Mesas N1-N5 */
.mesa-btn {
background: #0a0f24;
border: 1px solid #232e52;
color: white;
padding: 6px 2px;
border-radius: 8px;
cursor: pointer;
font-weight: bold;
font-size: 0.75rem;
transition: 0.2s;
line-height: 1.2;
}

.mesa-btn.active {
background: #d4af37; /* Botón activo Dorado Oro */
color: #060a1f;
border-color: #f4f5f7;
}

/* El Tapete de Juego de Casino */
.game-mat {
background: radial-gradient(circle, #0f1c15, #070d0a);
border: 3px solid #1f5c3d;
border-radius: 16px;
padding: 15px;
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
min-height: 160px;
align-items: center;
box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}

.slot-jugador { text-align: center; }

.carta {
width: 60px;
height: 90px;
background: #121a36;
border: 2px dashed #232e52;
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.6rem;
font-weight: bold;
margin: 0 auto 5px auto;
box-shadow: 0 4px 8px rgba(0,0,0,0.4);
color: #232e52;
}

.carta.ready { background: #ffffff; color: #000000; border: 2px solid #ffffff; }
.carta.waiting { animation: pulse 1.5s infinite; }

.nombre-jugador {
font-size: 0.75rem;
color: #a0aec0;
text-overflow: ellipsis;
overflow: hidden;
white-space: nowrap;
}

/* Botón de Acción Principal Dorado Premium */
.btn-play {
background: linear-gradient(135deg, #d4af37, #aa8416);
border: none;
color: #060a1f;
padding: 18px;
font-size: 1.2rem;
font-weight: bold;
border-radius: 12px;
cursor: pointer;
box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
letter-spacing: 0.5px;
}

.btn-play:disabled {
background: #232e52;
color: #a0aec0;
cursor: not-allowed;
box-shadow: none;
}

/* Historial */
.history { background: #0a0f24; padding: 15px; border-radius: 12px; border: 1px solid #232e52; }
.history h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #a0aec0; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
.history-list { display: flex; flex-direction: column; gap: 5px; }

.history-item {
display: flex;
justify-content: space-between;
font-size: 0.85rem;
padding: 5px;
border-bottom: 1px solid #232e52;
}

/* MODALES FINANCIEROS */
.modal-financiero {
display: none;
position: fixed;
top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0, 0, 0, 0.85);
justify-content: center;
align-items: center;
z-index: 1000;
padding: 20px;
}

.modal-content {
background: #0a0f24;
border: 1px solid #d4af37;
padding: 25px;
border-radius: 16px;
max-width: 400px;
width: 100%;
text-align: center;
}

.modal-content h3 { margin-top: 0; color: #d4af37; }
.info-caja { background: #050814; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 1.1rem; text-align: left; border: 1px solid #232e52; }
.btn-accion-modal { color: white; border: none; padding: 12px; width: 100%; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
.btn-wa-color { background: #25D366; }
.btn-retirar-color { background: #dc3545; }
.btn-cerrar-modal { background: transparent; color: #a0aec0; border: none; margin-top: 15px; cursor: pointer; text-decoration: underline; }
.input-modal { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; background-color: #050814; border: 1px solid #232e52; border-radius: 6px; color: white; }

@keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
</style>
</head>
<body>

<div class="app-container">

<div id="authContainer" class="auth-container">
<h2>SuerteFácil P2P</h2>
<input type="email" id="emailInput" class="auth-input" placeholder="Correo electrónico">

<div class="password-wrapper">
<input type="password" id="passwordInput" class="auth-input" placeholder="Contraseña">
