<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carta Mayor P2P</title>
    <style>
        body { background-color: #060a1f; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .app-container { width: 100%; max-width: 450px; padding: 20px; }
        #authContainer { display: block; }
        #gameInterface { display: none; }
        .btn-play { width: 100%; padding: 20px; background: #d4af37; border: none; font-weight: bold; cursor: pointer; border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="authContainer">
        <h2>Ingreso</h2>
        <input type="email" id="emailInput" placeholder="Correo">
        <input type="password" id="passwordInput" placeholder="Contraseña">
        <button id="btnLogin">ENTRAR</button>
    </div>

    <div id="gameInterface">
        <div id="saldoDisplay">$0</div>
        <button id="botonJugar" class="btn-play">BUSCAR PARTIDA</button>
        <div id="historyList"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDh8g0vyKbRfPPOZ1C0M0guBr0EJ77AyF8",
        authDomain: "carta-facil-a4e22.firebaseapp.com",
        databaseURL: "https://carta-facil-a4e22-default-rtdb.firebaseio.com",
        projectId: "carta-facil-a4e22",
        storageBucket: "carta-facil-a4e22.appspot.com",
        messagingSenderId: "530927580102",
        appId: "1:530927580102:web:865211e2b16e84869038c7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // ESCUCHA SI EL USUARIO ESTÁ LOGUEADO
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('gameInterface').style.display = 'block';
            
            // Cargar saldo
            onValue(ref(db, 'usuarios/' + user.uid + '/saldo'), (s) => {
                document.getElementById('saldoDisplay').innerText = "$" + (s.val() || 0);
            });
        } else {
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('gameInterface').style.display = 'none';
        }
    });

    document.getElementById('btnLogin').onclick = () => {
        signInWithEmailAndPassword(auth, document.getElementById('emailInput').value, document.getElementById('passwordInput').value)
        .catch(e => alert("Error: " + e.message));
    };
</script>
</body>
</html>
