<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: radial-gradient(circle at top,#18243b 0%,#0b1020 60%); color:#f4f7fb; font-family:'Inter',sans-serif; min-height:100vh; display:flex; justify-content:center; padding:20px; }
  .app-container { width:100%; max-width:460px; display:flex; flex-direction:column; gap:18px; }

  /* LOGIN */
  .auth-container { background:rgba(19,26,46,.95); border:1px solid #28314f; border-radius:24px; padding:28px; backdrop-filter:blur(12px); box-shadow: 0 15px 35px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04); display:flex; flex-direction:column; gap:16px; }
  .auth-container h2 { font-size:1.7rem; font-weight:800; text-align:center; letter-spacing:-1px; }
  .auth-subtitle { text-align:center; color:#94a3b8; font-size:.9rem; margin-top:-8px; margin-bottom:10px; }
  .auth-input { width:100%; background:#0f172a; border:1px solid #28314f; border-radius:14px; padding:15px; color:white; font-size:.95rem; transition:.2s; }
  .auth-input:focus { outline:none; border-color:#00e07b; box-shadow:0 0 0 4px rgba(0,224,123,.08); }
  .btn-auth { flex:1; padding:14px; border-radius:14px; border:none; font-weight:700; cursor:pointer; transition:.2s; }
  .btn-login { background:linear-gradient(135deg,#00e07b,#00b86b); color:#08140d; box-shadow:0 10px 20px rgba(0,224,123,.25); }

  /* MESA & EVENTO */
  .event-box { background:linear-gradient(135deg,#131a2e,#18243b); border:1px solid #28314f; border-radius:20px; padding:18px; box-shadow:0 12px 20px rgba(0,0,0,.25); }
  .event-title { font-size:.85rem; color:#00e07b; font-weight:700; margin-bottom:8px; }
  .event-main { font-size:1.15rem; font-weight:800; margin-bottom:8px; }
  .event-sub { color:#94a3b8; font-size:.82rem; }
  .progression-container { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .mesa-btn { background:#131a2e; border:1px solid #28314f; border-radius:18px; padding:16px 12px; color:white; cursor:pointer; transition:.2s; text-align:left; min-height:100px; }
  .mesa-btn.active { border-color:#00e07b; box-shadow:0 0 0 2px rgba(0,224,123,.15); }
  .mesa-nivel { font-size:.72rem; color:#94a3b8; margin-bottom:8px; }
  .mesa-precio { font-size:1.2rem; font-weight:800; margin-bottom:6px; }
  .mesa-premio { color:#00e07b; font-size:.82rem; }
  
  /* ... resto de tu CSS (game-mat, modales, etc, se mantienen iguales) ... */
</style>

<div class="auth-container">
  <h2>Carta Royale Club</h2>
  <div class="auth-subtitle">Acceso privado · Partidas exclusivas en tiempo real</div>
  </div>

<div class="event-box">
  <div class="event-title">EVENTO PRIVADO ACTIVO</div>
  <div class="event-main">Carta Royale — Night Session</div>
  <div class="event-sub">Jugadores conectados: 38 · Acceso limitado · Evento en vivo</div>
</div>

<div class="progression-container">
  <button class="mesa-btn active" data-valor="2000">
    <div class="mesa-nivel">MESA N1</div>
    <div class="mesa-precio">$2K</div>
    <div class="mesa-premio">Premio aprox: $5.4K</div>
  </button>
  </div>
