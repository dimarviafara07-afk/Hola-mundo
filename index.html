<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Mayor P2P</title>
<style>
/* Estilos generales oscuros tipo casino */
body { margin: 0; padding: 0; background-color: #121620; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
.app-container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; }
.auth-container { background: linear-gradient(135deg, #1e2433, #151a26); padding: 25px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; border: 1px solid #252e4d; }
.auth-container h2 { margin: 0; font-size: 1.4rem; text-align: center; color: #00ff88; }
.auth-input { width: 100%; padding: 12px; box-sizing: border-box; background-color: #0f131a; border: 1px solid #3b4875; border-radius: 8px; color: white; font-size: 1rem; outline: none; transition: 0.2s; }
.password-wrapper { position: relative; width: 100%; }
.btn-toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: #a0aec0; cursor: pointer; font-size: 1.2rem; }
.auth-buttons { display: flex; gap: 10px; margin-top: 5px; }
.btn-auth { flex: 1; padding: 12px; font-size: 0.95rem; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; }
.btn-login { background: #00ff88; color: #121620; }
.btn-register { background: transparent; color: #00ff88; border: 2px solid #00ff88; }
.game-interface { display: none; flex-direction: column; gap: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #1e2433, #151a26); padding: 15px; border-radius: 12px; }
.btn-logout { background: transparent; color: #ff3366; border: 1px solid #ff3366; padding: 3px 6px; font-size: 0.7rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
.saldo-monto { font-size: 1.2rem; font-weight: bold; color: #00ff88; }
.mesas-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.mesa-btn { background: #252e4d; border: 2px solid #3b4875; color: white; padding: 10px 5px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
.mesa-btn.active { background: #00ff88; color: #121620; border-color: #00ff88; }
.game-mat { background: radial-gradient(circle, #1a2f24, #0f1c15); border: 3px solid #1f5c3d; border-radius: 16px; padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 160px; align-items: center; }
.carta { width: 60px; height: 90px; background: #252e4d; border: 2px dashed #48588f; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: bold; margin: 0 auto 5px auto; color: #48588f; }
.carta.ready { background: #ffffff; color: #000000; border: 2px solid #ffffff; }
.carta.waiting { animation: pulse 1.5s infinite; }
.btn-play { background: linear-gradient(135deg, #00ff88, #00b35f); border: none; color: #121620; padding: 18px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; }
.modal-financiero { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.modal-content { background: #1e2433; border: 1px solid #3b4875; padding: 25px; border-radius: 16px; max-width: 400px; width: 100%; text-align: center; }
@keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
</style>
</head>
<body>
<div class="app-container">
    <div id="authContainer" class="auth-container">
        <h2>SuerteFácil P2P</h2>
        <input type="email" id="emailInput" class="auth-input" placeholder="Correo electrónico">
        <div class="password-wrapper">
            <input type="password" id="passwordInput" class="auth-input" placeholder="Contraseña">
            <button type="button" id="btnTogglePassword" class="btn-toggle-password">👁️</button>
        </div>
        <div class="auth-buttons">
            <button id="btnLogin" class="btn-auth btn-login">Ingresar</button>
            <button id="btnRegister" class="btn-auth btn-register">Registrarse</button>
        </div>
    </div>

    <div id="gameInterface" class="game-interface">
        <div class="header">
            <div class="user-info-box">
                <div id="nombreUsuarioActivo" style="font-weight: bold; color: #e2e8f0;">Usuario</div>
                <button id="btnSignOut" class="btn-logout">Salir</button>
            </div>
            <div class="saldo-box" style="text-align: right;">
                <div style="font-size: 0.75rem; color: #a0aec0;">Tu Saldo</div>
                <div id="saldoDisplay" class="saldo-monto">$0</div>
                <div class="caja-botones-transaccion">
                    <button id="btnAbrirRecarga" class="btn-transaccion" style="background:#00b35f;">+ RECARGAR</button>
                    <button id="btnAbrirRetiro" class="btn-transaccion" style="background:#ff3366;">- RETIRAR</button>
                </div>
            </div>
        </div>

        <div class="progression-container">
            <span style="font-size: 0.85rem; color: #a0aec0;">Selecciona tu Mesa</span>
            <div class="mesas-grid">
                <button class="mesa-btn active" data-valor="2000">N1 ($2k)</button>
                <button class="mesa-btn" data-valor="4000">N2 ($4k)</button>
                <button class="mesa-btn" data-valor="8000">N3 ($8k)</button>
                <button class="mesa-btn" data-valor="16000">N4 ($16k)</button>
                <button class="mesa-btn" data-valor="32000">N5 ($32k)</button>
            </div>
        </div>

        <div class="game-mat">
            <div class="slot-jugador"><div id="cartaLocal" class="carta">?</div><div class="nombre-jugador">Tú</div></div>
            <div class="slot-jugador"><div id="cartaRival1" class="carta">?</div><div class="nombre-jugador" id="labelRival1">Rival 1</div></div>
            <div class="slot-jugador"><div id="cartaRival2" class="carta">?</div><div class="nombre-jugador" id="labelRival2">Rival 2</div></div>
        </div>
        <button id="botonJugar" class="btn-play">BUSCAR PARTIDA ($2k)</button>
        <div class="history"><h3>ÚLTIMAS PARTIDAS</h3><div id="historyList" class="history-list"></div></div>
    </div>
</div>

<div id="modalRecarga" class="modal-financiero"><div class="modal-content"><h3>Recargar</h3><button id="btnCerrarRecarga" class="btn-cerrar-modal">Volver</button></div></div>
<div id="modalRetiro" class="modal-financiero"><div class="modal-content"><h3>Retirar</h3><button id="btnCerrarRetiro" class="btn-cerrar-modal">Volver</button></div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, runTransaction, off } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDh8g0vyKbRfPPOZ1C0M0guBr0EJ77AyF8",
        authDomain: "carta-facil-a4e22.firebaseapp.com",
        databaseURL: "https://carta-facil-a4e22-default-rtdb.firebaseio.com",
        projectId: "carta-facil-a4e22",
        storageBucket: "carta-facil-a4e22.appspot.com",
        messagingSenderId: "530927580102",
        appId: "1:530927580102:web:865211e2b16e84869038c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // Lógica Auth y UI
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('gameInterface').style.display = 'flex';
            document.getElementById('nombreUsuarioActivo').innerText = user.email.split('@')[0];
            onValue(ref(db, 'usuarios/' + user.uid + '/saldo'), (s) => {
                document.getElementById('saldoDisplay').innerText = "$" + (s.val() || 0).toLocaleString();
            });
        } else {
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('gameInterface').style.display = 'none';
        }
    });

    document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, document.getElementById('emailInput').value, document.getElementById('passwordInput').value);
    document.getElementById('btnRegister').onclick = () => createUserWithEmailAndPassword(auth, document.getElementById('emailInput').value, document.getElementById('passwordInput').value);
    document.getElementById('btnSignOut').onclick = () => signOut(auth);
</script>
</body>
</html>
