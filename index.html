<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Mayor P2P</title>
<style>
/* Estilos generales oscuros tipo casino - AZUL MEDIANOCHE Y DORADO */
body {
    margin: 0;
    padding: 0;
    background-color: #060a1f; 
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

.app-container {
    width: 100%;
    max-width: 450px;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* SECCIÓN DE AUTENTICACIÓN */
.auth-container {
    background: linear-gradient(135deg, #0a0f24, #121a36);
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 15px;
    border: 1px solid #d4af37;
}

.auth-container h2 { margin: 0; font-size: 1.4rem; text-align: center; color: #d4af37; }

.auth-input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    background-color: #050814;
    border: 1px solid #232e52;
    border-radius: 8px;
    color: white;
    font-size: 1rem;
    outline: none;
}

.password-wrapper { position: relative; width: 100%; }
.btn-toggle-password {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; color: #d4af37; cursor: pointer;
}

.auth-buttons { display: flex; gap: 10px; margin-top: 5px; }
.btn-auth { flex: 1; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; }
.btn-login { background: #d4af37; color: #060a1f; }
.btn-register { background: transparent; color: #d4af37; border: 2px solid #d4af37; }

/* INTERFAZ DE JUEGO */
.game-interface { display: none; flex-direction: column; gap: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #0a0f24, #121a36); padding: 15px; border-radius: 12px; border: 1px solid #232e52; }
.saldo-monto { font-size: 1.2rem; font-weight: bold; color: #d4af37; }
.mesa-btn { background: #0a0f24; border: 1px solid #232e52; color: white; padding: 10px 5px; border-radius: 8px; cursor: pointer; }
.mesa-btn.active { background: #d4af37; color: #060a1f; }
.btn-play { background: linear-gradient(135deg, #d4af37, #aa8416); color: #060a1f; padding: 18px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; }

/* Modales y otros estilos se mantienen igual */
.modal-financiero { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
.modal-content { background: #0a0f24; border: 1px solid #d4af37; padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; }
</style>
</head>
<body>

            <button type="button" id="btnTogglePassword" class="btn-toggle-password">👁️</button>
        </div>
        <div class="auth-buttons">
            <button id="btnLogin" class="btn-auth btn-login">Ingresar</button>
            <button id="btnRegister" class="btn-auth btn-register">Registrarse</button>
        </div>
    </div>

    <div id="gameInterface" class="game-interface">
        <div class="header">
            <div id="nombreUsuarioActivo" style="font-weight: bold; color: #d4af37; cursor: pointer;">Usuario</div>
            <div class="saldo-box">

                <button id="btnSignOut" class="btn-logout">Salir</button>
            </div>
        </div>
        <button id="botonJugar" class="btn-play">BUSCAR PARTIDA ($2k)</button>
    </div>
</div>

</html>
