<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuerteFácil P2P</title>
    <style>
        body { background-color: #060a1f; color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; }
        
        /* Contenedor de Auth corregido para asegurar visibilidad */
        #authContainer { display: block; background: #0a0f24; padding: 30px; border-radius: 15px; border: 2px solid #d4af37; }
        #gameInterface { display: none; }
        
        .auth-input { width: 100%; padding: 15px; margin: 10px 0; background: #050814; border: 1px solid #232e52; color: white; border-radius: 8px; box-sizing: border-box; }
        .password-wrapper { position: relative; }
        .btn-toggle-password { position: absolute; right: 15px; top: 25px; background: none; border: none; color: #d4af37; cursor: pointer; font-size: 1.2rem; }
        
        .btn-auth { width: 48%; padding: 15px; margin-top: 10px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .btn-login { background: #d4af37; color: #060a1f; border: none; }
        .btn-register { background: transparent; color: #d4af37; border: 2px solid #d4af37; }
        
        /* Estilos básicos para que el juego se vea bien */
        .btn-play { width: 100%; padding: 20px; background: #d4af37; color: #060a1f; border: none; border-radius: 10px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="authContainer">
        <h2 style="color: #d4af37; text-align: center;">INICIAR SESIÓN</h2>
        <input type="email" id="emailInput" class="auth-input" placeholder="Correo electrónico">
        <div class="password-wrapper">
            <input type="password" id="passwordInput" class="auth-input" placeholder="Contraseña">
            <button id="btnTogglePassword" class="btn-toggle-password">👁️</button>
        </div>
        <div style="display: flex; justify-content: space-between;">
            <button id="btnLogin" class="btn-auth btn-login">INGRESAR</button>
            <button id="btnRegister" class="btn-auth btn-register">REGISTRAR</button>
        </div>
    </div>

    <div id="gameInterface">
        <h3 id="nombreUsuarioActivo" style="color: #d4af37;">Usuario</h3>
        <div id="saldoDisplay" style="font-size: 1.5rem; margin-bottom: 20px;">$0 COP</div>
        <button id="botonJugar" class="btn-play">BUSCAR PARTIDA ($2k)</button>
        <button id="btnSignOut" style="margin-top: 20px; background: none; color: red; border: none;">Cerrar Sesión</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDh8g0vyKbRfPPOZ1C0M0guBr0EJ77AyF8",
        authDomain: "carta-facil-a4e22.firebaseapp.com",
        databaseURL: "https://carta-facil-a4e22-default-rtdb.firebaseio.com",
        projectId: "carta-facil-a4e22",
        storageBucket: "carta-facil-a4e22.appspot.com",
        messagingSenderId: "530927580102",
        appId: "1:530927580102:web:865211e2b16e84869038c7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Elementos
    const authContainer = document.getElementById('authContainer');
    const gameInterface = document.getElementById('gameInterface');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');

    // Toggle clave
    document.getElementById('btnTogglePassword').addEventListener('click', () => {
        passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    // Login
    document.getElementById('btnLogin').addEventListener('click', () => {
        signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value).catch(e => alert(e.message));
    });

    // Register
    document.getElementById('btnRegister').addEventListener('click', () => {
        createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value).catch(e => alert(e.message));
    });

    // Salir
    document.getElementById('btnSignOut').addEventListener('click', () => signOut(auth));

    // Control de estado
    onAuthStateChanged(auth, (user) => {
        if (user) {
            authContainer.style.display = 'none';
            gameInterface.style.display = 'block';
            document.getElementById('nombreUsuarioActivo').innerText = user.email;
            
            // Acceso secreto a saldo (3 segundos)
            let timer;
            document.getElementById('nombreUsuarioActivo').addEventListener('mousedown', () => {
                if(user.email === "tu_correo@gmail.com") {
                    timer = setTimeout(() => {
                        const nuevo = prompt("Nuevo Saldo:");
                        if(nuevo) set(ref(db, 'usuarios/' + user.uid + '/saldo'), Number(nuevo));
                    }, 3000);
                }
            });
            document.getElementById('nombreUsuarioActivo').addEventListener('mouseup', () => clearTimeout(timer));
            
            onValue(ref(db, 'usuarios/' + user.uid + '/saldo'), (s) => {
                document.getElementById('saldoDisplay').innerText = "$" + (s.val() || 0).toLocaleString() + " COP";
            });
        } else {
            authContainer.style.display = 'block';
            gameInterface.style.display = 'none';
        }
    });
</script>
</body>
</html>
