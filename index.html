<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuerteFácil P2P</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #131c2e;
            --bg-input: #0b111e;
            --primary-gold: #d9b44a;
            --primary-gold-hover: #bda03c;
            --green-recargar: #22c55e;
            --pink-jubilado: #f43f5e;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --border-gold: #d9b44a;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 15px; 
            margin: 0; 
            box-sizing: border-box;
        }

        .app-container { width: 100%; max-width: 430px; }
        
        .card { 
            background: var(--bg-card); 
            padding: 1.5rem; 
            border-radius: 1.2rem; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
            margin-bottom: 15px;
        }

        .hidden { display: none !important; }
        .form-group { margin-bottom: 15px; }
        
        input { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #243557; 
            background: var(--bg-input); 
            color: var(--text-main); 
            box-sizing: border-box; 
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--primary-gold); }

        .error-message {
            background: rgba(244, 63, 94, 0.1);
            color: #fda4af;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid var(--pink-jubilado);
        }

        /* DISEÑO DE LA CAPTURA DE PANTALLA */
        /* Header Usuario */
        .user-header { display: flex; justify-content: space-between; align-items: flex-start; position: relative; }
        .user-info h3 { margin: 0 0 5px 0; font-size: 1.3rem; letter-spacing: 0.5px; }
        .btn-salir { background: rgba(244, 63, 94, 0.2); border: 1px solid var(--pink-jubilado); color: var(--pink-jubilado); padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
        
        .saldo-box { text-align: right; }
        .saldo-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }
        .saldo-val { font-size: 1.6rem; color: var(--primary-gold); font-weight: bold; }
        
        .header-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 15px; width: 100%; }
        .btn-recargar { background: var(--green-recargar); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .btn-jubilado { background: var(--pink-jubilado); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }

        /* Selector de Mesas */
        .section-title { text-align: center; color: var(--text-muted); font-size: 0.95rem; margin-bottom: 12px; font-weight: 500; }
        .mesas-grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .mesas-grid::-webkit-scrollbar { display: none; }
        
        .mesa-btn {
            flex: 0 0 76px;
            background: #18253c;
            border: 1px solid #243557;
            border-radius: 10px;
            padding: 10px 4px;
            color: var(--text-main);
            text-align: center;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            transition: all 0.2s ease;
        }
        .mesa-btn strong { font-size: 0.95rem; }
        .mesa-btn.active {
            background: var(--primary-gold);
            color: #000000;
            border-color: var(--primary-gold);
            font-weight: bold;
        }

        /* Tapete de Juego */
        .tapete-card { border: 2px solid var(--border-gold); background: #0f182b; border-radius: 1.2rem; padding: 2rem 1rem; }
        .game-mat { display: flex; justify-content: space-around; margin-bottom: 5px; }
        .carta-box { text-align: center; width: 28%; display: flex; flex-direction: column; align-items: center; }
        
        .carta { 
            width: 100%;
            max-width: 75px;
            height: 110px; 
            background: #1d2942; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 2rem; 
            font-weight: bold;
            color: #43587d;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .carta.revelada { background: #ffffff; color: #090d16; transform: rotateY(360deg); }
        .carta-label { font-size: 0.8rem; margin-top: 10px; color: var(--text-muted); width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Botón de Acción Principal */
        .btn-buscar {
            background: var(--primary-gold);
            color: #000000;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            padding: 16px;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-buscar:active { transform: scale(0.98); }
        .btn-buscar:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Historial Footer */
        .footer-historial {
            background: #131c2e;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-top: 15px;
            cursor: pointer;
        }
        .historial-lista { max-height: 110px; overflow-y: auto; margin-top: 10px; font-weight: normal; }
        .historial-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1d2942; font-size: 0.8rem; color: #cbd5e1; }

        .divider { text-align: center; margin: 15px 0 5px 0; color: #475569; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="authView" class="card">
        <h2 style="text-align: center; margin-top: 0; color: var(--primary-gold)">Acceso SuerteFácil</h2>
        <div id="errorBox" class="error-message hidden"></div>
        <form id="loginForm">
            <div class="form-group"><input type="email" id="email" placeholder="Correo electrónico" required></div>
            <div class="form-group"><input type="password" id="pass" placeholder="Contraseña" required></div>
            <button type="submit" class="btn-buscar" style="margin-top:0;">INGRESAR</button>
            <div class="divider">o si eres nuevo</div>
            <button type="button" id="btnRegister" class="btn-buscar" style="background:#1d2942; color:white; font-size:1rem; padding:12px;">REGISTRARSE</button>
        </form>
    </div>

    <div id="gameView" class="card hidden" style="background:transparent; padding:0; box-shadow:none;">
        
        <div class="card">
            <div class="user-header">
                <div class="user-info">
                    <h3 id="txtUsername">Usuario</h3>
                    <button id="btnOut" class="btn-salir">Salir</button>
                </div>
                <div class="saldo-box">
                    <div class="saldo-title">Tu Saldo</div>
                    <div id="saldoDisplay" class="saldo-val">$0</div>
                </div>
            </div>
            <div class="header-buttons">
                <button id="btnRecargar" class="btn-recargar">+ RECARGAR</button>
                <button class="btn-jubilado">- JUBILADO</button>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Selecciona tu Mesa</div>
            <div class="mesas-grid">
                <div class="mesa-btn active" data-mesa="N1" data-apuesta="2000" data-label="$2k"><strong>N1</strong><span>(2000 dólares)</span></div>
                <div class="mesa-btn" data-mesa="N2" data-apuesta="4000" data-label="$4k"><strong>N2</strong><span>(4.000 dólares)</span></div>
                <div class="mesa-btn" data-mesa="N3" data-apuesta="8000" data-label="$8k"><strong>N3</strong><span>(8.000 dólares)</span></div>
                <div class="mesa-btn" data-mesa="N4" data-apuesta="16000" data-label="$16k"><strong>N4</strong><span>(16.000 dólares)</span></div>
                <div class="mesa-btn" data-mesa="N5" data-apuesta="32000" data-label="$32k"><strong>N5</strong><span>(32.000 dólares)</span></div>
            </div>
        </div>

        <div class="tapete-card">
            <div class="game-mat">
                <div class="carta-box">
                    <div class="carta" id="cartaLocal">¿</div>
                    <div class="carta-label" id="lblLocal">Tú</div>
                </div>
                <div class="carta-box">
                    <div class="carta" id="cartaRival1">¿</div>
                    <div class="carta-label" id="lblRival1">Rival 1...</div>
                </div>
                <div class="carta-box">
                    <div class="carta" id="cartaRival2">¿</div>
                    <div class="carta-label" id="lblRival2">Rival 2...</div>
                </div>
            </div>
        </div>

        <button id="btnPlay" class="btn-buscar">BUSCAR PARTIDA ($2k)</button>

        <div class="footer-historial">
            <span>ÚLTIMAS PARTIDAS (GANADORES)</span>
            <div id="historialLista" class="historial-lista"></div>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, off, set, get, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDh8g0vyKbRfPPOZ1C0M0guBr0EJ77AyF8",
        authDomain: "carta-facil-a4e22.firebaseapp.com",
        databaseURL: "https://carta-facil-a4e22-default-rtdb.firebaseio.com",
        projectId: "carta-facil-a4e22",
        storageBucket: "carta-facil-a4e22.appspot.com",
        messagingSenderId: "530927580102",
        appId: "1:530927580102:web:865211e2b16e84869038c7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Elementos DOM
    const authView = document.getElementById('authView'), gameView = document.getElementById('gameView');
    const loginForm = document.getElementById('loginForm'), emailInput = document.getElementById('email'), passInput = document.getElementById('pass');
    const errorBox = document.getElementById('errorBox'), txtUsername = document.getElementById('txtUsername'), saldoDisplay = document.getElementById('saldoDisplay');
    const btnOut = document.getElementById('btnOut'), btnRecargar = document.getElementById('btnRecargar'), btnPlay = document.getElementById('btnPlay'), btnRegister = document.getElementById('btnRegister');
    const cartaLocal = document.getElementById('cartaLocal'), cartaRival1 = document.getElementById('cartaRival1'), cartaRival2 = document.getElementById('cartaRival2');
    const lblLocal = document.getElementById('lblLocal'), lblRival1 = document.getElementById('lblRival1'), lblRival2 = document.getElementById('lblRival2'), historialLista = document.getElementById('historialLista');
    const mesaBotones = document.querySelectorAll('.mesa-btn');

    let saldoRef = null, historialRef = null;
    let saldoActual = 0, apuestaActual = 2000, textoApuesta = "$2k", mesaSeleccionada = "N1";

    // Manejo de clicks en selectores de mesa de tu imagen
    mesaBotones.forEach(btn => {
        btn.addEventListener('click', () => {
            mesaBotones.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            apuestaActual = parseInt(btn.getAttribute('data-apuesta'));
            textoApuesta = btn.getAttribute('data-label');
            mesaSeleccionada = btn.getAttribute('data-mesa');
            if(!btnPlay.disabled) {
                btnPlay.innerText = `BUSCAR PARTIDA (${textoApuesta})`;
            }
        });
    });

    // Control del Estado de Sesión
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            authView.classList.add('hidden'); gameView.classList.remove('hidden');
            const username = user.email.split('@')[0];
            txtUsername.innerText = username;
            lblLocal.innerText = username;

            saldoRef = ref(db, `usuarios/${user.uid}/saldo`);
            onValue(saldoRef, (snapshot) => {
                saldoActual = snapshot.val() || 0;
                saldoDisplay.innerText = `$${saldoActual.toLocaleString('es-CO')}`;
            });

            historialRef = ref(db, `usuarios/${user.uid}/historial`);
            onValue(historialRef, (snapshot) => {
                historialLista.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.values(data).reverse().slice(0, 4).forEach(item => {
                        const div = document.createElement('div');
                        div.className = "historial-item";
                        div.innerHTML = `<span>Mesa ${item.mesa} - ${item.resultado}</span><strong>${item.resultado==='GANÓ'?'+':'-'}$${item.monto.toLocaleString()}</strong>`;
                        historialLista.appendChild(div);
                    });
                } else {
                    historialLista.innerHTML = "<div style='font-size:0.8rem; color:#475569;'>No hay partidas registradas</div>";
                }
            });
        } else {
            authView.classList.remove('hidden'); gameView.classList.add('hidden');
            if (saldoRef) off(saldoRef);
            if (historialRef) off(historialRef);
        }
    });

    // Botón Recargar de tu interfaz
    btnRecargar.addEventListener('click', async () => {
        const user = auth.currentUser;
        if(user) {
            await set(ref(db, `usuarios/${user.uid}/saldo`), saldoActual + 50000);
        }
    });

    // Autenticación básica
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        try { await signInWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value); } 
        catch (err) { errorBox.innerText = "Error de credenciales."; errorBox.classList.remove('hidden'); }
    });

    btnRegister.addEventListener('click', async () => {
        if(!emailInput.value || !passInput.value) return;
        try {
            const res = await createUserWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value);
            await set(ref(db, `usuarios/${res.user.uid}/saldo`), 10000);
        } catch (err) { errorBox.innerText = "Error al registrar."; errorBox.classList.remove('hidden'); }
    });

    btnOut.addEventListener('click', () => signOut(auth));

    // LÓGICA DE BÚSQUEDA MULTIJUGADOR REAL CON TUS DICTÁMENES VISUALES
    btnPlay.addEventListener('click', async () => {
        if (saldoActual < apuestaActual) {
            alert(`No tienes saldo suficiente para la mesa ${mesaSeleccionada} (Requiere $${apuestaActual.toLocaleString()})`);
            return;
        }

        btnPlay.disabled = true;
        btnPlay.style.background = "#475569";
        btnPlay.innerText = "BUSCANDO RIVALES...";
        resetMesa();

        const user = auth.currentUser;
        const lobbyRef = ref(db, `salas_espera/${mesaSeleccionada}`);
        const miCupoRef = push(lobbyRef);

        await set(miCupoRef, { uid: user.uid, name: user.email.split('@')[0] });

        onValue(lobbyRef, async (snapshot) => {
            const lista = snapshot.val();
            if (lista && Object.keys(lista).length >= 3) {
                off(lobbyRef);
                const keys = Object.keys(lista).slice(0, 3);
                const jugadores = keys.map(k => lista[k]);

                if (jugadores.some(j => j.uid === user.uid)) {
                    keys.forEach(async k => await set(ref(db, `salas_espera/${mesaSeleccionada}/${k}`), null));
                    iniciarRondaP2P(jugadores, user);
                }
